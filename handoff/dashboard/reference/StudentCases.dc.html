<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cases</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/safetrail/components/bundle.css">
<link rel="stylesheet" href="app.css">
<script src="ds/safetrail/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@600&amp;family=Nunito:wght@400;600;700&amp;display=swap">
<style>body{margin:0;background:#F7FAFB}</style>
</helmet>
<div class="app st-root" data-density="comfortable">
  <dc-import name="Sidebar" role="student" active="Cases" hint-size="248px,900px"></dc-import>
  <div class="app-col">
    <dc-import name="Topbar" role="student" section="Cases" section-href="StudentCases.dc.html" hint-size="100%,64px"></dc-import>
    <main class="page page-student">
      <div class="ph">
        <div>
          <h1>Cases</h1>
          <p>A case gathers your evidence in one place. Nothing reaches reviewers until you escalate.</p>
        </div>
        <div class="ph-actions">
          <x-import component-from-global-scope="SafeTrail.Button" variant="primary">New case</x-import>
        </div>
      </div>

      <div class="stack">
        <x-import component-from-global-scope="SafeTrail.Tabs" label="Filter cases" items="{{tabs}}" selected="{{zero}}"></x-import>
        <ul class="list">
          <sc-for list="{{cases}}" as="c" hint-placeholder-count="4">
            <li>
              <a class="list-link" href="{{c.href}}">
                <span class="kind" aria-hidden="true">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"></path></svg>
                </span>
                <span style="flex: 1; min-width: 0;">
                  <h2>{{c.title}}</h2>
                  <p class="num">{{c.meta}}</p>
                </span>
                <sc-if value="{{c.isDraft}}" hint-placeholder-val="{{false}}"><span class="pill pill-draft"><span class="pdot" aria-hidden="true"></span>Draft</span></sc-if>
                <sc-if value="{{c.hasBadge}}" hint-placeholder-val="{{true}}"><x-import component-from-global-scope="SafeTrail.StatusBadge" status="{{c.status}}"></x-import></sc-if>
                <sc-if value="{{c.locked}}" hint-placeholder-val="{{false}}">
                  <span class="share" title="Locked">
                    <x-import component-from-global-scope="SafeTrail.Icon" name="lock" size="sm" label="Locked"></x-import>
                  </span>
                </sc-if>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#55646E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
              </a>
            </li>
          </sc-for>
        </ul>
        <p class="cap" style="margin: 0;">Escalated cases are locked. You can always see their status and the closing note here.</p>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var cases = [
      { title: 'Group chat after org meeting', status: 'review', meta: 'Your case · 5 evidence items · 1 collaborator · Updated 13 Oct 2026', href: 'StudentCase.dc.html' },
      { title: 'Comments on my post', status: 'draft', meta: 'Your case · 3 evidence items · 1 collaborator · Updated 12 Oct 2026', href: 'StudentCase.dc.html' },
      { title: 'Edited photo shared in GC', status: 'escalated', meta: 'Bea Mendoza added you · 4 evidence items · Updated 13 Oct 2026', href: 'StudentCase.dc.html' },
      { title: 'Messages in March', status: 'closed', meta: 'Your case · 6 evidence items · Closed 10 Oct 2026', href: 'StudentCaseClosed.dc.html' }
    ].map(function (c) {
      return Object.assign({}, c, { isDraft: c.status === 'draft', hasBadge: c.status !== 'draft', locked: c.status !== 'draft' });
    });
    return {
      cases: cases,
      zero: 0,
      tabs: [{ label: 'All', count: 4 }, { label: 'Drafts', count: 1 }, { label: 'With reviewers', count: 2 }, { label: 'Closed', count: 1 }]
    };
  }
}
</script>
</body>
</html>
