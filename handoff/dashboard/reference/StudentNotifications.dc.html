<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notifications</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/safetrail/components/bundle.css">
<link rel="stylesheet" href="app.css">
<script src="ds/safetrail/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@600&amp;family=Nunito:wght@400;600;700&amp;display=swap">
<style>body{margin:0;background:#F7FAFB}</style>
</helmet>
<div class="app st-root" data-density="comfortable">
  <dc-import name="Sidebar" role="student" active="Notifications" hint-size="248px,900px"></dc-import>
  <div class="app-col">
    <dc-import name="Topbar" role="student" section="Notifications" section-href="StudentNotifications.dc.html" open="{{yes}}" hint-size="100%,64px"></dc-import>
    <main class="page page-student">
      <div class="ph">
        <div>
          <h1>Notifications</h1>
          <p>Updates about your cases and evidence people share with you. Notifications never show the contents of your evidence.</p>
        </div>
        <div class="ph-actions">
          <x-import component-from-global-scope="SafeTrail.Button" variant="secondary" icon="check">Mark all as read</x-import>
        </div>
      </div>

      <div class="stack">
        <x-import component-from-global-scope="SafeTrail.Tabs" label="Filter notifications" items="{{tabs}}" selected="{{zero}}"></x-import>

        <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
          <section class="stack-sm" aria-label="{{g.label}}">
            <h2 class="group-label">{{g.label}}</h2>
            <ul class="list">
              <sc-for list="{{g.items}}" as="n" hint-placeholder-count="2">
                <li>
                  <a class="list-link" href="{{n.href}}" style="align-items: flex-start;">
                    <span class="{{n.iconCls}}" aria-hidden="true"><x-import component-from-global-scope="SafeTrail.Icon" name="{{n.icon}}" size="sm"></x-import></span>
                    <span style="flex: 1; min-width: 0;">
                      <span style="display: block; font-size: 15px; line-height: 24px; font-weight: {{n.weight}};">{{n.text}}</span>
                      <span class="cap num" style="display: block;">{{n.time}}</span>
                    </span>
                    <sc-if value="{{n.unread}}" hint-placeholder-val="{{false}}"><span class="ndot" role="img" aria-label="Unread"></span></sc-if>
                  </a>
                </li>
              </sc-for>
            </ul>
          </section>
        </sc-for>
        <p class="cap" style="margin: 0;">SafeTrail sends notifications in the app only. Nothing is sent by email or text.</p>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    var cls = { info: 'nicon', attn: 'nicon nicon-attn', done: 'nicon nicon-done', ok: 'nicon nicon-ok' };
    function n(icon, kind, text, time, unread, href) {
      return { icon: icon, iconCls: cls[kind], text: text, time: time, unread: unread, href: href, weight: unread ? '600' : '400' };
    }
    return {
      yes: true,
      zero: 0,
      tabs: [{ label: 'All', count: 7 }, { label: 'Unread', count: 2 }],
      groups: [
        { label: 'Today', items: [
          n('clipboard-list', 'info', 'Ms. Reyes moved “Group chat after org meeting” to Under Review.', '13 Oct 2026, 9:20 AM', true, 'StudentCase.dc.html')
        ] },
        { label: 'Earlier this week', items: [
          n('paperclip', 'info', 'Paolo Cruz attached 2 evidence items to “Comments on my post”.', '12 Oct 2026, 8:14 PM', true, 'StudentCase.dc.html'),
          n('arrow-up', 'attn', 'Bea Mendoza escalated “Edited photo shared in GC”. You are a collaborator on this case.', '12 Oct 2026, 6:40 PM', false, 'StudentCases.dc.html'),
          n('users', 'info', 'Paolo Cruz joined “Comments on my post” with your password link.', '11 Oct 2026, 7:55 PM', false, 'StudentCase.dc.html'),
          n('circle-check', 'done', '“Messages in March” was closed. Read the closing note.', '10 Oct 2026, 4:45 PM', false, 'StudentCaseClosed.dc.html')
        ] },
        { label: 'Earlier', items: [
          n('inbox', 'info', 'Bea Mendoza shared evidence with you: a Facebook post from 5 Oct.', '9 Oct 2026, 1:12 PM', false, 'Main.dc.html'),
          n('file-check-2', 'ok', 'Your capture “Group chat, 3 Oct” was saved to your vault.', '3 Oct 2026, 9:12 PM', false, 'Main.dc.html')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
