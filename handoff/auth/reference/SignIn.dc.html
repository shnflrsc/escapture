<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in to SafeTrail</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/safetrail/components/bundle.css">
<link rel="stylesheet" href="auth.css">
<script src="ds/safetrail/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@600&amp;family=Nunito:wght@400;600;700&amp;display=swap">
<style>body{margin:0;background:#FFFFFF}</style>
</helmet>
<div class="auth">
  <aside class="brand" aria-label="About SafeTrail">
    <a class="logo" href="#">
      <svg width="36" height="36" viewBox="0 0 32 32" fill="none" role="img" aria-label="SafeTrail logo"><g stroke="#66A3BF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3 5 7v8.5c0 6.4 4.4 11.2 11 13.5 6.6-2.3 11-7.1 11-13.5V7L16 3Z"></path><path d="M11 17.5v-2.2a5 5 0 0 1 10 0v3.2"></path><path d="M13.6 20.5v-5.2a2.4 2.4 0 0 1 4.8 0v6.2"></path><path d="M16 15.8v6.7"></path><path d="M11.2 20.5c.3 1.2.9 2.2 1.7 3"></path><path d="M20.8 21.5c-.2.8-.6 1.5-1.1 2.1"></path></g></svg>
      <b>SafeTrail</b>
    </a>

    <figure class="illus" style="margin: 0;">
    <svg viewBox="0 0 520 520" width="100%" aria-hidden="true" focusable="false" style="display: block; max-width: 520px; height: auto; margin: 0 auto;">
      <circle cx="370" cy="170" r="120" fill="#E6F1F6"></circle>
      <path d="M0 430 C 120 400, 240 460, 520 410" stroke="#CDE2EC" stroke-width="1.5" fill="none"></path>
      <path d="M0 470 C 140 445, 300 500, 520 455" stroke="#CDE2EC" stroke-width="1.5" fill="none"></path>
      <path d="M0 505 C 160 485, 320 530, 520 495" stroke="#CDE2EC" stroke-width="1.5" fill="none"></path>
      <path d="M40 500 C 90 420, 230 450, 250 360 S 340 260, 370 246" stroke="#AACADB" stroke-width="18" stroke-linecap="round" fill="none"></path>
      <path d="M40 500 C 90 420, 230 450, 250 360 S 340 260, 370 246" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 12" fill="none"></path>
      <circle cx="40" cy="500" r="7" fill="#85B8CE"></circle>
      <ellipse cx="370" cy="248" rx="82" ry="8" fill="#CDE2EC"></ellipse>
      <rect x="310" y="150" width="120" height="96" rx="14" fill="#66A3BF"></rect>
      <rect x="300" y="126" width="140" height="34" rx="12" fill="#85B8CE"></rect>
      <rect x="352" y="178" width="36" height="44" rx="10" fill="#FFFFFF"></rect>
      <circle cx="370" cy="194" r="5" fill="#223F50"></circle>
      <rect x="368" y="196" width="4" height="13" rx="2" fill="#223F50"></rect>
      <circle cx="156" cy="434" r="9" fill="#FFFFFF" stroke="#66A3BF" stroke-width="3"></circle>
      <circle cx="250" cy="360" r="9" fill="#FFFFFF" stroke="#66A3BF" stroke-width="3"></circle>
      <circle cx="306" cy="274" r="9" fill="#FFFFFF" stroke="#66A3BF" stroke-width="3"></circle>
      <rect x="62" y="352" width="96" height="62" rx="10" fill="#FFFFFF" stroke="#CDE2EC" stroke-width="1.5"></rect>
      <circle cx="82" cy="372" r="8" fill="#CDE2EC"></circle>
      <path d="M98 370 H142" stroke="#85B8CE" stroke-width="4" stroke-linecap="round"></path>
      <path d="M74 391 H146 M74 401 H122" stroke="#CDE2EC" stroke-width="4" stroke-linecap="round"></path>
      <rect x="146" y="268" width="88" height="56" rx="10" fill="#FFFFFF" stroke="#CDE2EC" stroke-width="1.5"></rect>
      <rect x="158" y="280" width="46" height="12" rx="6" fill="#CDE2EC"></rect>
      <rect x="176" y="300" width="46" height="12" rx="6" fill="#85B8CE"></rect>
      <rect x="432" y="246" width="78" height="52" rx="10" fill="#FFFFFF" stroke="#CDE2EC" stroke-width="1.5"></rect>
      <circle cx="455" cy="272" r="12" fill="#E2F3F0"></circle>
      <path d="M449 272 l4.5 4.5 l7.5 -8.5" stroke="#1D6359" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
      <path d="M474 266 H498 M474 279 H490" stroke="#CDE2EC" stroke-width="4" stroke-linecap="round"></path>
    </svg>
  </figure>

    
  </aside>

  <main class="main">
    <div class="topline">
      <a class="logo mlogo" href="#">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none" role="img" aria-label="SafeTrail logo"><g stroke="#66A3BF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3 5 7v8.5c0 6.4 4.4 11.2 11 13.5 6.6-2.3 11-7.1 11-13.5V7L16 3Z"></path><path d="M11 17.5v-2.2a5 5 0 0 1 10 0v3.2"></path><path d="M13.6 20.5v-5.2a2.4 2.4 0 0 1 4.8 0v6.2"></path><path d="M16 15.8v6.7"></path><path d="M11.2 20.5c.3 1.2.9 2.2 1.7 3"></path><path d="M20.8 21.5c-.2.8-.6 1.5-1.1 2.1"></path></g></svg>
        <b style="font-size: 20px;">SafeTrail</b>
      </a>
      <a class="link" href="#" style="display: inline-flex; align-items: center; gap: 4px;">
        <x-import component-from-global-scope="SafeTrail.Icon" name="chevron-left" size="sm"></x-import>Home
      </a>
      <span><span class="tl-text">New to SafeTrail? </span><a class="link" href="Register.dc.html">Create an account</a></span>
    </div>

    <div class="formwrap">
      <form class="form" method="post" onSubmit="{{submit}}" novalidate="novalidate">
        <div>
          <h1>Sign in</h1>
          
        </div>

        <sc-if value="{{showError}}" hint-placeholder-val="{{false}}">
          <div class="banner banner-attn" role="alert">
            <x-import component-from-global-scope="SafeTrail.Icon" name="info"></x-import>
            <p>That email or password isn't right. Check them and try again.</p>
          </div>
        </sc-if>

        <div class="fields">
          <div class="field">
            <label class="label" for="si-email">Email</label>
            <input id="si-email" class="input" type="email" name="email" autocomplete="email" placeholder="you@ms.bulsu.edu.ph" value="{{email}}" onChange="{{onEmail}}" aria-invalid="{{emailInvalid}}" aria-describedby="si-email-err">
            <sc-if value="{{emailMissing}}" hint-placeholder-val="{{false}}">
              <p id="si-email-err" class="err"><x-import component-from-global-scope="SafeTrail.Icon" name="circle-alert" size="sm"></x-import>Enter the email you signed up with.</p>
            </sc-if>
          </div>

          <div class="field">
            <div class="labelrow">
              <label class="label" for="si-pw">Password</label>
              <a class="link" href="#" style="font-size: 14px; line-height: 20px;">Can't sign in?</a>
            </div>
            <div class="pw">
              <input id="si-pw" class="input" type="{{pwType}}" name="password" autocomplete="current-password" value="{{password}}" onChange="{{onPassword}}" aria-invalid="{{pwInvalid}}" aria-describedby="si-pw-err">
              <button type="button" class="eye" aria-label="{{eyeLabel}}" aria-pressed="{{eyePressed}}" onClick="{{toggleEye}}">
                <sc-if value="{{showPw}}" hint-placeholder-val="{{false}}">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.73 5.08A10.4 10.4 0 0 1 12 5c7 0 10 7 10 7a13.2 13.2 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.5 13.5 0 0 0 2 12s3 7 10 7a9.7 9.7 0 0 0 5.39-1.61"></path><path d="M14.08 14.16a3 3 0 0 1-4.18-4.24"></path><path d="m2 2 20 20"></path></svg>
                </sc-if>
                <sc-if value="{{hidePw}}" hint-placeholder-val="{{true}}">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </sc-if>
              </button>
            </div>
            <sc-if value="{{pwMissing}}" hint-placeholder-val="{{false}}">
              <p id="si-pw-err" class="err"><x-import component-from-global-scope="SafeTrail.Icon" name="circle-alert" size="sm"></x-import>Enter your password.</p>
            </sc-if>
          </div>

          <label class="check"><input type="checkbox" checked="checked"> Keep me signed in on this device</label>
        </div>

        <button type="submit" class="btn btn-primary">Sign in</button>

        
      </form>
    </div>

    <nav class="foot" aria-label="Legal">
      <a href="#">Privacy Policy</a><a href="#">Terms of Service</a><a href="#">Contact the team</a>
    </nav>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"demoError":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var s = this.state || {};
    var demo = this.props.demoError === true || this.props.demoError === 'true';
    var email = s.email != null ? s.email : (demo ? 'maya.santos@bulsu.edu.ph' : '');
    var password = s.password != null ? s.password : (demo ? 'wrongpass1' : '');
    var tried = !!s.tried;
    var showPw = !!s.showPw;
    var emailMissing = tried && !email.trim();
    var pwMissing = tried && !password;
    return {
      email: email,
      password: password,
      onEmail: function (e) { self.setState({ email: e.target.value }); },
      onPassword: function (e) { self.setState({ password: e.target.value }); },
      submit: function (e) { if (e && e.preventDefault) e.preventDefault(); self.setState({ tried: true }); },
      emailMissing: emailMissing,
      pwMissing: pwMissing,
      emailInvalid: emailMissing ? 'true' : 'false',
      pwInvalid: pwMissing ? 'true' : 'false',
      showError: demo && !s.tried,
      showPw: showPw,
      hidePw: !showPw,
      pwType: showPw ? 'text' : 'password',
      eyeLabel: showPw ? 'Hide password' : 'Show password',
      eyePressed: showPw ? 'true' : 'false',
      toggleEye: function () { self.setState({ showPw: !showPw }); }
    };
  }
}
</script>
</body>
</html>
