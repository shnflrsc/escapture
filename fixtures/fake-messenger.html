<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="safetrail:fixture-kind" content="facebook_message" />
    <title>Fake Messenger conversation (SafeTrail fixture)</title>
    <style>
      body { margin: 0; font-family: Helvetica, Arial, sans-serif; color: #050505; display: flex; height: 100vh; }
      nav { width: 280px; border-right: 1px solid #dadde1; padding: 16px; font-size: 14px; color: #65676b; }
      main { flex: 1; display: flex; flex-direction: column; }
      header { padding: 12px 16px; border-bottom: 1px solid #dadde1; font-weight: 600; }
      .thread { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
      .time { align-self: center; color: #65676b; font-size: 12px; margin: 8px 0; }
      .msg { max-width: 60%; padding: 8px 12px; border-radius: 18px; font-size: 15px; line-height: 1.35; }
      .them { align-self: flex-start; background: #e4e6eb; }
      .me { align-self: flex-end; background: #0084ff; color: #fff; }
      .composer { border-top: 1px solid #dadde1; padding: 12px 16px; }
      .composer div { border-radius: 18px; background: #f0f2f5; padding: 8px 12px; min-height: 20px; color: #65676b; }
    </style>
  </head>
  <body>
    <nav>Chats<br /><br />SafeTrail test fixture, not a real site</nav>
    <main role="main">
      <header>Sample Classmate</header>
      <div class="thread">
        <div class="time">12 Oct 2026, 20:41</div>
        <div class="msg them">nobody wants you in the group project</div>
        <div class="msg them">we already told the prof you did nothing</div>
        <div class="msg me">That's not true. I sent my part on Friday.</div>
        <div class="msg them">sure. keep crying about it</div>
        <div class="time">12 Oct 2026, 21:07</div>
        <div class="msg them">don't bother coming to the meeting tomorrow</div>
      </div>
      <div class="composer">
        <!-- The legitimate composer. The tamper checks must ignore this. -->
        <div role="textbox" contenteditable="true" aria-label="Message">Aa</div>
      </div>
    </main>
  </body>
</html>
